[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jones-prompt-generator"
version = "0.1.0"
description = "Deterministic, public-safe prompt catalog tooling"
readme = "README.md"
requires-python = "==3.13.*"
authors = [{name = "Jones Systems"}]
classifiers = ["Programming Language :: Python :: 3.13"]
dependencies = []

[project.scripts]
prompt-generator = "prompt_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_generator = ["py.typed", "templates/*.md", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
